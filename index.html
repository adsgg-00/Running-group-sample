<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple TV 風格 - 跑者特輯</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* 基礎深色設定 */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* 頂部導覽列透明化 */
        .navbar {
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            position: absolute;
            width: 100%;
            z-index: 1000;
        }
        
        .search-bar {
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 6px;
        }
        
        .search-bar::placeholder { color: rgba(255, 255, 255, 0.6); }

        /* 主視覺區塊 (Hero Section) */
        .hero-section {
            height: 85vh;
            position: relative;
            /* 這裡載入你的跑者圖片 */
            background-image: url('run.2.jpg'); 
            background-size: cover;
            background-position: center;
        }

        /* 左側黑色漸層遮罩，讓文字清楚顯示 */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0) 100%);
            display: flex;
            align-items: center;
        }

        /* 標題與標籤樣式 */
        .hero-badge {
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }

        .hero-title {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            margin-bottom: 0.5rem;
        }

        /* 按鈕樣式 */
        .btn-play {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 32px;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        .btn-play:hover { background-color: #e0e0e0; }

        .btn-add {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }
        .btn-add:hover { background-color: rgba(255, 255, 255, 0.3); }

        /* 底部橫向滑動片單 */
        .carousel-section {
            padding: 40px 4%;
            margin-top: -60px; /* 稍微往上疊加在背景圖上 */
            position: relative;
            z-index: 10;
            background: linear-gradient(to top, #121212 80%, rgba(18,18,18,0) 100%);
        }

        .section-title {
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .section-title:hover { color: #cccccc; }

        /* 影片卡片樣式 */
        .movie-card {
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background-color: #2a2a2a;
            position: relative;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .movie-card:hover {
            transform: scale(1.03);
            outline: 3px solid rgba(255,255,255,0.8);
        }
        
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark pt-3 px-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4" href="#">
                <i class="fa-brands fa-apple me-2"></i> TV
            </a>
            
            <div class="collapse navbar-collapse justify-content-center">
                <ul class="navbar-nav gap-4">
                    <li class="nav-item"><a class="nav-link text-white fw-bold" href="#">首頁</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50 fw-bold" href="#">電影</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50 fw-bold" href="#">體育</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-3">
                <div class="input-group input-group-sm" style="width: 200px;">
                    <span class="input-group-text bg-transparent border-0 text-white"><i class="fa-solid fa-search"></i></span>
                    <input type="text" class="form-control search-bar" placeholder="搜尋">
                </div>
                <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                    <i class="fa-solid fa-user text-white small"></i>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-overlay">
            <div class="container-fluid px-5">
                <div class="row">
                    <div class="col-md-6 col-lg-5 text-start">
                        <span class="hero-badge text-white d-inline-block mb-3">熱門運動紀錄片</span>
                        <h1 class="hero-title">跑者無懼</h1>
                        
                        <div class="d-flex align-items-center gap-3 mb-3 text-light small fw-bold">
                            <span class="bg-dark rounded px-2 py-1 border border-secondary"><i class="fa-brands fa-apple"></i> 紀錄片 · 體育</span>
                            <span>13+</span>
                        </div>
                        
                        <p class="fs-6 text-light mb-4" style="line-height: 1.6; opacity: 0.9;">
                            一群頂尖田徑運動員在賽道上挑戰人體極限，汗水、淚水與無數次的起跑，只為了在終點線前超越昨天的自己。深入了解跑者背後堅韌不拔的故事。
                        </p>
                        
                        <div class="d-flex gap-3">
                            <button class="btn btn-play border-0 shadow"><i class="fa-solid fa-play me-2"></i>播放</button>
                            <button class="btn btn-add"><i class="fa-solid fa-plus fs-5"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="carousel-section">
        <h2 class="section-title">在 Apple TV 上繼續觀看 <i class="fa-solid fa-chevron-right ms-2 fs-6 mt-1 text-secondary"></i></h2>
        
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide" style="width: 300px;">
                    <div class="movie-card shadow">
                        <img src="https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=600&q=80" alt="Thumbnail">
                    </div>
                </div>
                <div class="swiper-slide" style="width: 300px;">
                    <div class="movie-card shadow">
                        <img src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600&q=80" alt="Thumbnail">
                    </div>
                </div>
                <div class="swiper-slide" style="width: 300px;">
                    <div class="movie-card shadow">
                        <img src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=600&q=80" alt="Thumbnail">
                    </div>
                </div>
                <div class="swiper-slide" style="width: 300px;">
                    <div class="movie-card shadow">
                        <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=600&q=80" alt="Thumbnail">
                    </div>
                </div>
                <div class="swiper-slide" style="width: 300px;">
                    <div class="movie-card shadow">
                        <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&q=80" alt="Thumbnail">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: "auto", // 根據 CSS 設定的寬度自動顯示數量
            spaceBetween: 20,      // 卡片間距
            freeMode: true,        // 允許自由滑動
        });
    </script>
</body>
</html>
